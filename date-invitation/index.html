<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Date with Clarissa 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe0e9,#ffc2d1)}.card{width:min(92%,440px);padding:30px 22px;text-align:center;background:#fff;border-radius:25px;box-shadow:0 12px 35px #d94f7b30;z-index:1}.heart{font-size:60px;animation:beat 1s infinite}@keyframes beat{50%{transform:scale(1.15)}}h1{color:#e84375;font-size:28px}p{color:#777;line-height:1.6}.buttons{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:25px;min-height:55px}button{border:0;padding:13px 25px;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer}#yesBtn,#nextBtn{background:#ff4d79;color:white}#yesBtn:hover,#nextBtn:hover{background:#e52f62}#noBtn{background:#eee;color:#555}#noBtn.running{position:fixed;z-index:10}#page2{display:none}.backBtn{background:#fce7ee;color:#a92d55;margin-right:8px}.floating-heart{position:fixed;bottom:-30px;pointer-events:none;animation:floatUp 5s linear forwards;z-index:0}@keyframes floatUp{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}@media(max-width:360px){h1{font-size:24px}.card{padding:25px 16px}button{padding:12px 20px}}
</style>
</head>
<body>
<main class="card">
<section id="page1">
<div class="heart">💗</div>
<h1>Clarissa, will you go on a date with me?</h1>
<p>I have something special planned for us.<br>So... what do you say? 🥹💕</p>
<div class="buttons"><button id="yesBtn">Yes! 💖</button><button id="noBtn">No 🙈</button></div>
</section>
<section id="page2">
<div class="heart">💗</div>
<h1>YAY, Clarissa! 💖</h1>
<p>It’s a date! 💐</p>
<p>I can’t wait to see you, Clarissa! 💕</p>
</section>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');

  function moveNoButton() {
    noBtn.classList.add('running');
    const pad = 12;
    const maxX = Math.max(pad, window.innerWidth - noBtn.offsetWidth - pad);
    const maxY = Math.max(pad, window.innerHeight - noBtn.offsetHeight - pad);
    noBtn.style.left = (pad + Math.random() * Math.max(0, maxX - pad)) + 'px';
    noBtn.style.top = (pad + Math.random() * Math.max(0, maxY - pad)) + 'px';
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('touchstart', function (event) {
    event.preventDefault();
    moveNoButton();
  }, { passive: false });

  yesBtn.addEventListener('click', function () {
    page1.style.display = 'none';
    page2.style.display = 'block';
    for (let i = 0; i < 18; i++) {
      setTimeout(function () {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = ['❤️', '💖', '💕', '💗', '💘'][Math.floor(Math.random() * 5)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (18 + Math.random() * 25) + 'px';
        document.body.appendChild(heart);
        setTimeout(function () { heart.remove(); }, 5000);
      }, i * 120);
    }
  });
});
</script>
</body>
</html>
